<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CivicFix AI{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="hero-band">
    <div class="wrap hero-inner">
      <div class="brand">
        <svg class="pin" width="30" height="30" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C7.6 2 4 5.6 4 10c0 6 8 12 8 12s8-6 8-12c0-4.4-3.6-8-8-8z" stroke="currentColor" stroke-width="1.6"/>
          <path d="M9 10.5l2 2 4-4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>CivicFix AI</span>
      </div>
      <nav>
        <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Report a problem</a>
        <a href="/dashboard" class="{{ 'active' if request.path == '/dashboard' else '' }}">Authority dashboard</a>
      </nav>
    </div>
  </div>
  <main class="wrap page">
    {% block content %}{% endblock %}
  </main>
  <footer class="wrap">
    <span>CivicFix AI — Flask + scikit-learn (TF-IDF · Logistic Regression) running locally.</span>
  </footer>
</body>
</html>
